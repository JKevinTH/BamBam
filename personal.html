<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/personal.css">
    <link rel="stylesheet" href="components/header.css">
</head>
<body>

    <header>

        <mi-header></mi-header>

    </header>

    <main class="contenido">

        <section class="inicio">
            <div class="inicio_texto">
                <h1>Control del personal</h1>
                <p class="inicio_subtitulo" id="fecha-hoy">Entradas y salidas del turno</p>
            </div>
            <div class="inicio_usuario">
                <p>Usuario</p>
            </div>
        </section>

        <section class="kpis">
            <div class="kpi"><div class="kpi__titulo">Presentes ahora</div><div class="kpi__valor" id="r-presentes">0</div></div>
            <div class="kpi"><div class="kpi__titulo">Sin registrar</div><div class="kpi__valor" id="r-sin">0</div></div>
            <div class="kpi kpi--oscuro"><div class="kpi__titulo">Retardos</div><div class="kpi__valor" id="r-retardos">0</div></div>
        </section>

        <section class="tabla-contenedor">
            <table class="tabla">
                <thead>
                    <tr>
                        <th scope="col">Empleado</th>
                        <th scope="col">Puesto</th>
                        <th scope="col">Turno</th>
                        <th scope="col">Entrada</th>
                        <th scope="col">Salida</th>
                        <th scope="col">Horas</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Acción</th>
                    </tr>
                </thead>
                <tbody id="personal"></tbody>
            </table>
        </section>

    </main>
    <footer></footer>
    <script src="components/header.js"></script>
    <script src="js/app.js"></script>
    <script src="js/personal.js"></script>
</body>
</html>
